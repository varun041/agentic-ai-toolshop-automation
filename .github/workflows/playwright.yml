name: Toolshop Agentic Test Automation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only chromium is ever launched (support/hooks.ts) — the multi-browser
      # playwright.config.ts projects are unused scaffold, not part of this
      # Cucumber-driven suite. Installing only chromium keeps CI fast.
      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke run (@smoke)
        run: npm run test:smoke

      # Runs only if the smoke step above succeeded — GitHub Actions skips a
      # step by default once an earlier step in the job has failed, so no
      # explicit `if:` is needed here to enforce the smoke gate.
      - name: Full regression run (@regression)
        run: npm run test:regression

      - name: API-only run (@api)
        run: npm run test:api

      # Runs even if an earlier stage failed, so a failed run still ships a
      # report for diagnosis instead of leaving allure-results unpublished.
      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Populated by support/hooks.ts's After hook only on scenario failure
      # (Playwright trace + full-page screenshot) — see docs/epics/architecture_AA-1.md §5.
      - name: Upload failure diagnostics (traces & screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            test-results/traces/
            test-results/screenshots/
          retention-days: 30
